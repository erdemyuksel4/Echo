name = "echo-server"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
ALLOWED_CREATOR_IDS = ""

[durable_objects]
bindings = [
  { name = "GROUP_DO", class_name = "GroupDO" },
  { name = "USER_DO", class_name = "UserDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupDO", "UserDO"]
